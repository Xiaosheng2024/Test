name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --noconsole --onefile --clean --name "缺料汇总生成器" "缺料汇总生成器_Qt5.py"

      - name: Package artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\缺料汇总生成器.exe" "release\缺料汇总生成器.exe" -Force
          Compress-Archive -Path "release\缺料汇总生成器.exe" -DestinationPath "release\缺料汇总生成器_Windows.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 缺料汇总生成器_Windows
          path: |
            release/缺料汇总生成器.exe
            release/缺料汇总生成器_Windows.zip
          if-no-files-found: error
